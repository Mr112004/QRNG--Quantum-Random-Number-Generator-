<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1, maximum-scale=1, user-scalable=0" />
    <title>Quantum Key Engine</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700;900&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

    <style>
        :root {
            --bg: #050505; --card: rgba(22, 22, 22, 0.8); --accent: #E60012; --text: #ffffff;
            --muted: #9ca3af; --border: rgba(255, 255, 255, 0.1); --canvas-bg: #000;
            --lock-stroke: #ffffff; --success: #22c55e;
        }

        body[data-theme="light"] {
            --bg: #f5f5f7; --card: rgba(255, 255, 255, 0.95); --text: #1d1d1f;
            --border: rgba(0, 0, 0, 0.12); --canvas-bg: #ffffff; --lock-stroke: #1d1d1f;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: var(--text); font-family: 'Roboto', sans-serif; transition: background 0.4s, color 0.4s; overflow-x: hidden; }

        header { height: 75px; display: flex; align-items: center; justify-content: space-between; padding: 0 5%; border-bottom: 1px solid var(--border); background: rgba(10,10,10,0.8); backdrop-filter: blur(15px); position: sticky; top: 0; z-index: 1000; }
        .logo { display: flex; align-items: center; gap: 10px; font-weight: 900; text-transform: uppercase; text-decoration: none; color: inherit; font-size: 0.95rem; }
        .logo-icon { background: var(--accent); padding: 3px 9px; border-radius: 5px; color: #fff; transition: background 0.3s; }

        .header-actions { display: flex; align-items: center; gap: 15px; }
        .theme-pill { display: flex; background: rgba(128,128,128,0.15); border: 1.5px solid var(--border); padding: 3.5px; border-radius: 14px; width: 78px; height: 40px; position: relative; cursor: pointer; }
        .theme-slider { position: absolute; width: 34px; height: 30px; background: var(--accent); top: 3.5px; left: 4px; border-radius: 10px; transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); z-index: 1; }
        body[data-theme="light"] .theme-slider { transform: translateX(36px); }
        .theme-btn { flex: 1; display: flex; align-items: center; justify-content: center; z-index: 2; font-size: 1.1rem; color: var(--muted); }

        .main-container { max-width: 1600px; margin: 25px auto; padding: 0 25px; display: grid; grid-template-columns: 320px 1fr; gap: 30px; }
        
        @media (max-width: 1024px) { 
            .main-container { grid-template-columns: 1fr; }
            .sidebar { position: fixed; top: 0; left: 0; height: 100vh; width: 300px; background: var(--bg); z-index: 2000; padding: 100px 20px; transform: translateX(-100%); border-right: 1px solid var(--border); box-shadow: 20px 0 50px rgba(0,0,0,0.8); }
            .side-toggle { display: flex !important; }
        }

        .side-toggle { position: fixed; left: 0; top: 50%; width: 35px; height: 60px; background: var(--accent); color: #fff; display: none; align-items: center; justify-content: center; border-radius: 0 10px 10px 0; cursor: pointer; z-index: 2100; font-weight: 900; }

        /* PRIVACY LOCK UI */
        #privacy-gate { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 3000; display: none; flex-direction: column; align-items: center; justify-content: center; backdrop-filter: blur(20px); }
        .pin-pad { display: grid; grid-template-columns: repeat(3, 70px); gap: 15px; margin-top: 30px; }
        .pin-btn { width: 70px; height: 70px; border-radius: 50%; background: rgba(255,255,255,0.05); border: 1px solid var(--border); color: #fff; font-size: 1.5rem; font-weight: 900; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: 0.2s; }
        .pin-btn:active { background: var(--accent); transform: scale(0.9); }
        .pin-display { display: flex; gap: 15px; margin-bottom: 20px; }
        .pin-dot { width: 15px; height: 15px; border-radius: 50%; background: rgba(255,255,255,0.1); border: 1px solid var(--border); transition: 0.3s; }
        .pin-dot.active { background: var(--accent); box-shadow: 0 0 15px var(--accent); }

        .card { background: var(--card); border: 1px solid var(--border); border-radius: 24px; position: relative; overflow: hidden; backdrop-filter: blur(30px); transition: 0.3s; }
        .card:hover { border-color: var(--accent); box-shadow: 0 0 40px rgba(230,0,18,0.1); }
        
        .tip { position: relative; cursor: help; border-bottom: 1px dashed var(--muted); }
        .tip::after {
            content: attr(data-tip); position: absolute; bottom: 125%; left: 50%; transform: translateX(-50%);
            background: #111; color: #fff; padding: 8px 12px; border-radius: 8px; font-size: 0.7rem; width: 180px;
            opacity: 0; pointer-events: none; transition: 0.3s; z-index: 100; text-align: center; border: 1px solid var(--accent);
        }
        .tip:hover::after { opacity: 1; }

        .visualizer { height: 260px; background: var(--canvas-bg); position: relative; display: flex; align-items: center; justify-content: center; border-bottom: 1px solid var(--border); }
        .lock-icon { position: absolute; width: 110px; z-index: 5; color: var(--lock-stroke); }
        
        .password-box { background: rgba(0,0,0,0.3); padding: 25px; border-radius: 18px; font-family: 'JetBrains Mono'; font-size: 1.4rem; text-align: center; border: 1px solid var(--border); min-height: 90px; display: flex; align-items: center; justify-content: center; word-break: break-all; cursor: pointer; transition: 0.3s; margin: 20px 0; color: var(--text); }

        .btn-gen { background: var(--accent); color: #fff; border: none; padding: 18px; border-radius: 15px; font-weight: 900; width: 100%; cursor: pointer; text-transform: uppercase; box-shadow: 0 5px 25px rgba(230,0,18,0.4); }

        .len-btn { background: rgba(255,255,255,0.02); border: 1px solid var(--border); color: var(--text); padding: 10px 14px; border-radius: 10px; cursor: pointer; font-weight: 700; transition: 0.3s; }
        .len-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
        .check-item { display: flex; align-items: center; gap: 8px; font-size: 0.85rem; font-weight: 700; color: var(--muted); cursor: pointer; margin-bottom: 10px; }
        .check-item input { accent-color: var(--accent); width: 16px; height: 16px; }

        .lab-bar-bg { width: 100%; height: 10px; background: rgba(128,128,128,0.1); border-radius: 10px; margin: 15px 0; overflow: hidden; }
        .lab-bar-fill { height: 100%; width: 0%; background: var(--accent); transition: width 0.8s ease; }
        
        .history-item { padding: 14px; border-radius: 12px; border: 1px solid var(--border); font-size: 0.75rem; font-family: 'JetBrains Mono'; margin-bottom: 10px; display: flex; gap: 10px; align-items: center; background: rgba(255,255,255,0.01); cursor: pointer; transition: 0.2s; }
        .history-item:hover { border-color: var(--accent); }
        .history-item span { background: var(--accent); color: #fff; padding: 2px 6px; border-radius: 4px; font-weight: 900; }
        
        .toast { position: fixed; left: 50%; bottom: 35px; transform: translateX(-50%); background: var(--accent); color: #fff; padding: 14px 30px; border-radius: 12px; font-weight: 800; z-index: 5000; display: none; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    </style>
</head>
<body data-theme="dark">
    <div id="toast" class="toast">COPIED TO CLIPBOARD</div>
    <div class="side-toggle" id="side-toggle">></div>

    <!-- PRIVACY GATE MODAL -->
    <div id="privacy-gate">
        <div class="splash-logo" style="background:var(--accent); color:#fff; padding:10px 15px; border-radius:8px; font-weight:900; margin-bottom:20px;">Q</div>
        <h2 style="font-weight:900; text-transform:uppercase; letter-spacing:2px; font-size:1rem;">Vault Locked</h2>
        <p style="color:var(--muted); font-size:0.8rem; margin-top:5px;">Enter PIN to view history</p>
        
        <div class="pin-display" id="pin-display">
            <div class="pin-dot"></div><div class="pin-dot"></div><div class="pin-dot"></div><div class="pin-dot"></div>
        </div>

        <div class="pin-pad">
            <button class="pin-btn" onclick="addPin('1')">1</button>
            <button class="pin-btn" onclick="addPin('2')">2</button>
            <button class="pin-btn" onclick="addPin('3')">3</button>
            <button class="pin-btn" onclick="addPin('4')">4</button>
            <button class="pin-btn" onclick="addPin('5')">5</button>
            <button class="pin-btn" onclick="addPin('6')">6</button>
            <button class="pin-btn" onclick="addPin('7')">7</button>
            <button class="pin-btn" onclick="addPin('8')">8</button>
            <button class="pin-btn" onclick="addPin('9')">9</button>
            <button class="pin-btn" onclick="clearPin()">C</button>
            <button class="pin-btn" onclick="addPin('0')">0</button>
            <button class="pin-btn" onclick="closeGate()">×</button>
        </div>
    </div>

    <header>
        <a href="/" class="logo"><div class="logo-icon">Q</div> SUPER <span>QUANTUM</span></a>
        <div class="header-actions">
            <div id="lock-indicator" style="cursor:pointer; font-size:1.2rem; opacity:0.5;" onclick="toggleLockSet()">🔓</div>
            <div class="theme-pill" id="theme-sw">
                <div class="theme-slider"></div>
                <div class="theme-btn" id="dark-t">🌙</div>
                <div class="theme-btn" id="light-t">☀️</div>
            </div>
        </div>
    </header>

    <main class="main-container">
        <aside class="sidebar" id="sidebar">
            <div class="card" style="padding:25px; margin-bottom:20px;">
                <h4 style="font-weight:900; color:var(--muted); font-size:0.75rem; text-transform:uppercase; margin-bottom:15px; border-bottom:1px solid var(--border); padding-bottom:10px;">Safety Audit</h4>
                <div id="locked-audit" style="filter:blur(4px); pointer-events:none;">
                    <div style="font-size:0.95rem; display:flex; justify-content:space-between; margin-bottom:15px">✔ Length: <span id="s-len">--</span></div>
                    <div style="font-size:0.95rem; display:flex; justify-content:space-between; margin-bottom:15px">✔ Complexity: <span id="s-bits">--</span> bits</div>
                </div>
            </div>
            <div class="card" style="padding:25px; margin-bottom:20px;">
                <div style="display:flex; justify-content:space-between; margin-bottom:12px; align-items:center">
                    <h4 style="font-weight:900; color:var(--muted); font-size:0.75rem;">HISTORY</h4>
                    <div style="display:flex; gap:5px;">
                        <button id="export-h" style="background:none; border:1px solid var(--border); color:var(--muted); font-size:0.6rem; padding:3px 8px; border-radius:5px; cursor:pointer">Export</button>
                        <button id="clear-h" style="background:none; border:1px solid var(--border); color:var(--muted); font-size:0.6rem; padding:3px 8px; border-radius:5px; cursor:pointer">Clear</button>
                    </div>
                </div>
                <div id="history-list" style="filter:blur(5px); transition: 0.3s;"></div>
            </div>
        </aside>

        <section class="gen-sec">
            <div class="card">
                <div class="visualizer">
                    <canvas id="v-canvas"></canvas>
                    <svg class="lock-icon" viewBox="0 0 24 24" fill="currentColor">
                        <path id="shackle" d="M12 2a5 5 0 0 0-5 5v3h2V7a3 3 0 0 1 6 0v3h2V7a5 5 0 0 0-5-5z" stroke-width="0.5" stroke="currentColor"/>
                        <rect x="5" y="10" width="14" height="11" rx="2" fill="#FFD700" stroke-width="0.5" stroke="currentColor"/>
                    </svg>
                </div>
                <div style="padding:30px;">
                    <div style="display:grid; grid-template-columns: 1fr 1fr; gap:25px; margin-bottom:20px;">
                        <div><span class="control-label" style="font-weight:900; color:var(--muted); font-size:0.7rem; margin-bottom:10px; display:block">KEY LENGTH</span>
                            <div style="display:flex; gap:8px">
                                <button class="len-btn" data-len="8">8</button>
                                <button class="len-btn active" data-len="16">16</button>
                                <button class="len-btn" data-len="32">32</button>
                                <button class="len-btn" data-len="64">64</button>
                            </div>
                        </div>
                        <div><span class="tip" data-tip="Character sets included." style="font-weight:900; color:var(--muted); font-size:0.7rem; margin-bottom:10px; display:block">ENTROPY POOLS</span>
                            <div style="display:grid; grid-template-columns: 1fr 1fr">
                                <label class="check-item"><input type="checkbox" id="p-up" checked> UPPER</label>
                                <label class="check-item"><input type="checkbox" id="p-lo" checked> LOWER</label>
                                <label class="check-item"><input type="checkbox" id="p-nu" checked> NUMS</label>
                                <label class="check-item"><input type="checkbox" id="p-sy"> SYMS</label>
                            </div>
                        </div>
                    </div>
                    <div class="password-box" id="p-display" onclick="copyKey()">READY_TO_GENERATE</div>
                    <button class="btn-gen" id="gen-btn">GENERATE SECURE KEY</button>
                </div>
            </div>

            <div class="card" style="margin-top:25px; padding:30px;">
                <h3 style="font-size:1.2rem; text-transform:uppercase; margin-bottom:15px">Quantum Security Lab</h3>
                <input type="text" id="lab-input" style="width:100%; padding:18px; background:rgba(0,0,0,0.4); border:1px solid var(--border); color:var(--text); border-radius:15px; font-family:monospace; font-size:1.1rem; outline:none" placeholder="Verify Trace Analysis">
                <div id="lab-res" style="text-align:center; margin-top:20px; display:none">
                    <div style="color:var(--muted); font-size:0.75rem; font-weight:900">ENTROPY RATING</div>
                    <div style="font-size:2.4rem; font-weight:900; color:var(--success); margin:10px 0;">QUANTUM LEVEL</div>
                    <div class="lab-bar-bg"><div class="lab-bar-fill" id="lab-bar"></div></div>
                </div>
            </div>
        </section>
    </main>

    <script>
        const btn = document.getElementById('gen-btn'), disp = document.getElementById('p-display'), hList = document.getElementById('history-list');
        const vCanvas = document.getElementById('v-canvas'), vCtx = vCanvas.getContext('2d'), themeSw = document.getElementById('theme-sw');
        const side = document.getElementById('sidebar'), toggle = document.getElementById('side-toggle');
        const gate = document.getElementById('privacy-gate'), dots = document.querySelectorAll('.pin-dot');
        
        let activeLen = 16, currentKey = "", isOpen = false, history = [];
        let userPin = localStorage.getItem('vault_pin') || "";
        let enteredPin = "", isUnlocked = false;

        function vibrate() { if(navigator.vibrate) navigator.vibrate(25); }

        // --- PRIVACY LOCK LOGIC ---
        function toggleLockSet() {
            vibrate();
            if(!userPin) {
                let pin = prompt("Set a 4-digit PIN for your vault:");
                if(pin && pin.length === 4) {
                    localStorage.setItem('vault_pin', pin);
                    userPin = pin;
                    document.getElementById('lock-indicator').innerText = "🔒";
                    showToast("PIN SET SUCCESSFULLY");
                }
            } else {
                if(confirm("Remove PIN protection?")) {
                    localStorage.removeItem('vault_pin');
                    userPin = "";
                    document.getElementById('lock-indicator').innerText = "🔓";
                    unlockVault();
                }
            }
        }

        if(userPin) document.getElementById('lock-indicator').innerText = "🔒";

        function addPin(num) {
            vibrate();
            if(enteredPin.length < 4) {
                enteredPin += num;
                dots[enteredPin.length-1].classList.add('active');
                if(enteredPin.length === 4) {
                    if(enteredPin === userPin) {
                        unlockVault();
                        closeGate();
                    } else {
                        vibrate(); // Error vibration
                        enteredPin = "";
                        dots.forEach(d => d.classList.remove('active'));
                        showToast("INCORRECT PIN");
                    }
                }
            }
        }

        function clearPin() { vibrate(); enteredPin = ""; dots.forEach(d => d.classList.remove('active')); }
        function closeGate() { gate.style.display = 'none'; enteredPin = ""; dots.forEach(d => d.classList.remove('active')); }

        function unlockVault() {
            isUnlocked = true;
            document.getElementById('locked-audit').style.filter = "none";
            document.getElementById('locked-audit').style.pointerEvents = "all";
            hList.style.filter = "none";
        }

        // --- THEME & DRAWER ---
        const savedTheme = localStorage.getItem('theme') || 'dark';
        document.body.setAttribute('data-theme', savedTheme);
        themeSw.onclick = () => { vibrate(); const n = document.body.getAttribute('data-theme') === 'dark' ? 'light' : 'dark'; document.body.setAttribute('data-theme', n); localStorage.setItem('theme', n); };

        document.querySelectorAll('.len-btn').forEach(b => b.onclick = () => { vibrate(); document.querySelectorAll('.len-btn').forEach(x => x.classList.remove('active')); b.classList.add('active'); activeLen = parseInt(b.dataset.len); });

        toggle.onclick = () => {
            vibrate();
            if(userPin && !isUnlocked && !isOpen) {
                gate.style.display = 'flex';
                return;
            }
            isOpen = !isOpen;
            gsap.to(side, { x: isOpen ? 0 : '-100%', duration: 0.5, ease: "power3.inOut" });
            toggle.innerText = isOpen ? '<' : '>';
        };

        // --- PARTICLES & GENERATION ---
        let parts = [];
        class P { constructor(){this.init();} init(){this.x=Math.random()*vCanvas.width; this.y=Math.random()*vCanvas.height; this.vx=(Math.random()-0.5)*3; this.vy=(Math.random()-0.5)*3;} draw(){vCtx.fillStyle='rgba(230,0,18,0.5)'; vCtx.beginPath(); vCtx.arc(this.x,this.y,1.8,0,Math.PI*2); vCtx.fill();} update(){this.x+=this.vx; this.y+=this.vy; if(this.x<0||this.x>vCanvas.width)this.vx*=-1; if(this.y<0||this.y>vCanvas.height)this.vy*=-1;} }
        for(let i=0; i<85; i++) parts.push(new P());
        function loop(){ vCtx.fillStyle=getComputedStyle(document.body).getPropertyValue('--canvas-bg'); vCtx.fillRect(0,0,vCanvas.width,vCanvas.height); parts.forEach(p=>{p.update(); p.draw();}); requestAnimationFrame(loop); }
        loop();

        btn.onclick = async () => {
            vibrate();
            gsap.to("#shackle", { y: -7, rotation: -15, duration: 0.3 });
            btn.innerText = "SAMPLING..."; btn.disabled = true;
            
            const pools = { u: document.getElementById('p-up').checked, l: document.getElementById('p-lo').checked, n: document.getElementById('p-nu').checked, s: document.getElementById('p-sy').checked };
            let charset = '';
            if(pools.u) charset += 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
            if(pools.l) charset += 'abcdefghijklmnopqrstuvwxyz';
            if(pools.n) charset += '0123456789';
            if(pools.s) charset += '!@#$%^&*()_+-=';
            if(!charset) charset = 'ABCDEFG12345';

            try {
                const res = await fetch('/generate-password');
                const data = await res.json();
                setTimeout(() => {
                    let key = ''; for(let i=0; i<activeLen; i++) key += charset.charAt(Math.floor(Math.random() * charset.length));
                    currentKey = key; disp.innerText = currentKey;
                    document.getElementById('s-len').innerText = key.length;
                    document.getElementById('s-bits').innerText = Math.floor(key.length * 6.3);
                    document.getElementById('lab-res').style.display = 'block';
                    document.getElementById('lab-bar').style.width = '100%';
                    document.getElementById('lab-input').value = key;
                    btn.innerText = "GENERATE SECURE KEY"; btn.disabled = false;
                    gsap.to("#shackle", { y: 0, rotation: 0, duration: 0.5, ease: "bounce.out" });
                    history.unshift(key); renderHistory();
                }, 600);
            } catch (err) { btn.innerText = "API ERROR"; btn.disabled = false; }
        };

        function renderHistory() {
            hList.innerHTML = "";
            history.slice(0, 8).forEach(key => {
                const div = document.createElement('div');
                div.className = "history-item";
                div.innerHTML = `<span>Q</span> ${key.substring(0, 18)}...`;
                div.onclick = () => { vibrate(); navigator.clipboard.writeText(key); showToast("KEY COPIED"); };
                hList.appendChild(div);
            });
        }

        function copyKey() { vibrate(); if(!currentKey || currentKey.includes('READY')) return; navigator.clipboard.writeText(currentKey); showToast("COPIED TO CLIPBOARD"); }
        function showToast(msg) { const t = document.getElementById('toast'); t.innerText = msg; t.style.display = 'block'; setTimeout(() => t.style.display='none', 1500); }
        document.getElementById('clear-h').onclick = () => { vibrate(); history = []; renderHistory(); };
        document.getElementById('export-h').onclick = () => { vibrate(); if(history.length === 0) return; const blob = new Blob([history.join('\n')], { type: 'text/plain' }); const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = url; a.download = 'quantum_keys.txt'; a.click(); };

        function resize() { vCanvas.width = vCanvas.offsetWidth; vCanvas.height = vCanvas.offsetHeight; }
        window.addEventListener('resize', resize);
    </script>
</body>
</html>
