<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>QRNG - Super Quantum Engine</title>

<link rel="manifest" href="/static/manifest.json">
<meta name="theme-color" content="#E60012">

<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">

<style>
body {
    margin: 0;
    font-family: 'Roboto', sans-serif;
    background: #111;
    color: white;
}

header {
    padding: 20px 40px;
    background: #000;
}

.main-container {
    display: grid;
    grid-template-columns: 320px 1fr;
    gap: 30px;
    padding: 40px;
}

.card {
    background: rgba(255,255,255,0.05);
    padding: 30px;
    border-radius: 20px;
}

.password-box {
    padding: 20px;
    background: black;
    border-radius: 10px;
    margin-top: 20px;
    font-family: 'JetBrains Mono';
}

button {
    background: #E60012;
    border: none;
    padding: 15px;
    font-weight: bold;
    margin-top: 20px;
    width: 100%;
}

/* MOBILE FIX */
@media (max-width: 768px) {

    .main-container {
        grid-template-columns: 1fr;
        padding: 20px;
    }

}
</style>
</head>

<body>

<header>
SUPER <span style="color:#E60012">QUANTUM</span>
</header>

<div class="main-container">
    <div class="card">
        <h2>Quantum Key Engine</h2>
        <button onclick="generate()">Generate</button>
        <div class="password-box" id="output">READY</div>
    </div>
</div>

<script>
function generate() {
    fetch("/generate-password")
    .then(res => res.json())
    .then(data => {
        document.getElementById("output").innerText =
            data.key ? data.key : data.error;
    });
}

if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/static/sw.js');
}
</script>

</body>
</html>
