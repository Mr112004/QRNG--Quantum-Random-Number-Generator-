<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1, maximum-scale=1, user-scalable=0" />
    <title>Super Quantum | Select Profile</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#050505">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

    <style>
        :root {
            --bg: #050505;
            --accent: #E60012;
            --accent-glow: rgba(230, 0, 18, 0.4);
            --text: #ffffff;
            --muted: #9ca3af;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: var(--bg); color: var(--text); font-family: 'Roboto', sans-serif; overflow: hidden; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; }

        /* --- QUANTUM BACKGROUND CANVAS --- */
        #bg-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none; }

        .hero-section { text-align: center; z-index: 10; padding: 0 10%; }
        .tag { color: var(--accent); text-transform: uppercase; font-weight: 900; letter-spacing: 4px; font-size: 0.75rem; margin-bottom: 20px; display: block; transition: 0.3s; }
        h1 { font-size: clamp(2rem, 8vw, 5.5rem); font-weight: 900; line-height: 1; text-transform: uppercase; margin-bottom: 40px; }
        h1 span { color: var(--accent); transition: color 0.3s; }

        /* --- THEME SELECTOR --- */
        .theme-container { margin-bottom: 50px; }
        .theme-label { font-weight: 900; font-size: 0.7rem; text-transform: uppercase; color: var(--muted); letter-spacing: 3px; margin-bottom: 25px; display: block; }
        .theme-options { display: flex; gap: 30px; justify-content: center; align-items: center; }
        
        .energy-core {
            width: 45px; height: 45px; border-radius: 50%; cursor: pointer;
            border: 3px solid transparent; transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
        }
        .energy-core::after {
            content: ""; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 65px; height: 65px; border-radius: 50%; border: 1px solid transparent; transition: 0.4s;
        }
        .energy-core.active::after { border-color: inherit; transform: translate(-50%, -50%) scale(1.1); box-shadow: 0 0 20px var(--accent-glow); }
        .energy-core:hover { transform: scale(1.15); }

        .cta-btn {
            background: var(--accent); color: #fff; padding: 20px 50px; border-radius: 50px;
            font-weight: 900; text-transform: uppercase; text-decoration: none;
            box-shadow: 0 10px 30px var(--accent-glow); transition: 0.3s; border: none; cursor: pointer;
            display: inline-block; font-size: 0.9rem;
        }
        .cta-btn:hover { transform: scale(1.05); filter: brightness(1.2); }
    </style>
</head>
<body>
    <canvas id="bg-canvas"></canvas>

    <div class="hero-section">
        <span class="tag" id="theme-tag">System Ready</span>
        <h1>Computer Logic<br>Meets Real<br><span id="accent-text">Randomness</span></h1>

        <div class="theme-container">
            <span class="theme-label">Select Energy Profile</span>
            <div class="theme-options">
                <div class="energy-core active" style="background:#E60012; border-color:#E60012;" onclick="updateTheme('#E60012', 'Quantum Red', this)"></div>
                <div class="energy-core" style="background:#007AFF; border-color:#007AFF;" onclick="updateTheme('#007AFF', 'Cyber Blue', this)"></div>
                <div class="energy-core" style="background:#32D74B; border-color:#32D74B;" onclick="updateTheme('#32D74B', 'Neon Green', this)"></div>
                <div class="energy-core" style="background:#BF5AF2; border-color:#BF5AF2;" onclick="updateTheme('#BF5AF2', 'Plasma Purple', this)"></div>
            </div>
        </div>

        <a href="/generator" class="cta-btn">Initialize Engine</a>
    </div>

    <script>
        const canvas = document.getElementById('bg-canvas'), ctx = canvas.getContext('2d');
        let particles = [];

        function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        window.addEventListener('resize', resize); resize();

        function vibrate() { if(navigator.vibrate) navigator.vibrate(25); }

        function updateTheme(color, name, el) {
            vibrate();
            document.documentElement.style.setProperty('--accent', color);
            document.documentElement.style.setProperty('--accent-glow', color + '66'); // 40% alpha
            localStorage.setItem('accent', color);
            
            document.getElementById('theme-tag').innerText = name;
            document.querySelectorAll('.energy-core').forEach(c => c.classList.remove('active'));
            el.classList.add('active');

            gsap.fromTo("#accent-text", { opacity: 0.5 }, { opacity: 1, duration: 0.4 });
        }

        // --- QUANTUM FIELD ANIMATION ---
        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.vx = (Math.random() - 0.5) * 0.8;
                this.vy = (Math.random() - 0.5) * 0.8;
                this.s = Math.random() * 2 + 1;
            }
            update() {
                this.x += this.vx; this.y += this.vy;
                if(this.x < 0 || this.x > canvas.width) this.vx *= -1;
                if(this.y < 0 || this.y > canvas.height) this.vy *= -1;
            }
        }

        for(let i=0; i<100; i++) particles.push(new Particle());

        function loop() {
            ctx.clearRect(0,0,canvas.width, canvas.height);
            const accent = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim();
            
            particles.forEach((p, i) => {
                p.update();
                ctx.fillStyle = accent;
                ctx.globalAlpha = 0.4;
                ctx.beginPath(); ctx.arc(p.x, p.y, p.s, 0, Math.PI*2); ctx.fill();

                for(let j=i+1; j<particles.length; j++) {
                    let p2 = particles[j];
                    let dist = Math.sqrt((p.x-p2.x)**2 + (p.y-p2.y)**2);
                    if(dist < 150) {
                        ctx.strokeStyle = accent;
                        ctx.globalAlpha = (1 - dist/150) * 0.2;
                        ctx.lineWidth = 0.5;
                        ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p2.x, p2.y); ctx.stroke();
                    }
                }
            });
            requestAnimationFrame(loop);
        }
        loop();
        
        // Initial set from storage
        const saved = localStorage.getItem('accent');
        if(saved) {
            const match = Array.from(document.querySelectorAll('.energy-core')).find(c => c.style.backgroundColor.includes(saved));
            if(match) updateTheme(saved, "Energy Locked", match);
        }
    </script>
</body>
</html>
