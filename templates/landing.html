<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Super Quantum - The Future of Entropy</title>

<link rel="manifest" href="/static/manifest.json">
<meta name="theme-color" content="#E60012">

<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

<style>
body {
    margin: 0;
    font-family: 'Roboto', sans-serif;
    background: #050505;
    color: white;
    overflow-x: hidden;
}

nav {
    height: 70px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 40px;
    background: rgba(0,0,0,0.8);
}

.logo-text span { color: #E60012; }

.hero {
    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 0 40px;
    text-align: center;
}

.hero h1 {
    font-size: 4rem;
    font-weight: 900;
}

.hero span { color: #E60012; }

.cta-btn {
    background: #E60012;
    padding: 15px 40px;
    text-decoration: none;
    color: white;
    font-weight: 900;
    border-radius: 50px;
    margin-top: 30px;
}

.section {
    padding: 100px 40px;
}

.grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 60px;
}

.card-container {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px,1fr));
    gap: 25px;
}

.feature-card {
    background: rgba(255,255,255,0.05);
    padding: 30px;
    border-radius: 20px;
}

/* MOBILE FIX */
@media (max-width: 768px) {

    nav {
        padding: 0 20px;
    }

    .hero h1 {
        font-size: 2.5rem;
    }

    .section {
        padding: 60px 20px;
    }

    .grid {
        grid-template-columns: 1fr;
        gap: 30px;
    }

    .card-container {
        grid-template-columns: 1fr;
    }
}
</style>
</head>

<body>

<nav>
    <div class="logo-text">SUPER <span>QUANTUM</span></div>
    <a href="/generator" class="cta-btn">GENERATE KEY</a>
</nav>

<section class="hero">
    <h1>REAL <span>QUANTUM</span><br>RANDOMNESS</h1>
    <p>True entropy powered key generation engine.</p>
    <a href="/generator" class="cta-btn">ENTER ENGINE</a>
</section>

<footer style="text-align:center;padding:40px;">
© 2026 Super Quantum
</footer>

<script>
if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/static/sw.js');
}
</script>

</body>
</html>
